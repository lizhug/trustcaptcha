x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  SECRET_HASH_PEPPER: ${SECRET_HASH_PEPPER:?SECRET_HASH_PEPPER is required}

x-stateless-deploy: &stateless-deploy
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 5
    window: 60s
  update_config:
    order: start-first
    parallelism: 1
    delay: 10s
    failure_action: rollback
    monitor: 30s
  rollback_config:
    order: stop-first
    parallelism: 1

services:
  migrate:
    image: ${IMAGE_PREFIX}/migrate:${IMAGE_TAG:-latest}
    command:
      - sh
      - -ec
      - |
        until node -e "const net=require('node:net');const u=new URL(process.env.DATABASE_URL);const s=net.connect(Number(u.port||5432),u.hostname,()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"; do sleep 2; done
        pnpm --dir packages/database exec prisma migrate deploy
        pnpm --dir packages/database db:seed
    environment:
      <<: *app-environment
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@xuandev.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_CUSTOMER_NAME: ${SEED_CUSTOMER_NAME:-TrustCaptcha}
      SEED_CUSTOMER_SLUG: ${SEED_CUSTOMER_SLUG:-trustcaptcha}
      SEED_DEMO_ORIGIN: https://trustcaptcha.xuandev.com
      SEED_SIGNUP_ORIGIN: https://app.trustcaptcha.xuandev.com
      SEED_DEMO_SITE_KEY: ${DEMO_SITE_KEY:?DEMO_SITE_KEY is required}
      SEED_DEMO_SITE_SECRET: ${DEMO_SITE_SECRET:?DEMO_SITE_SECRET is required}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  dashboard:
    image: ${IMAGE_PREFIX}/dashboard:${IMAGE_TAG:-latest}
    environment:
      <<: *app-environment
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://app.trustcaptcha.xuandev.com
      DASHBOARD_ORIGIN: https://app.trustcaptcha.xuandev.com
      NEXT_PUBLIC_DASHBOARD_URL: https://app.trustcaptcha.xuandev.com
      NEXT_PUBLIC_API_URL: https://api.trustcaptcha.xuandev.com
      NEXT_PUBLIC_SIGNUP_SITE_KEY: ${DEMO_SITE_KEY:?DEMO_SITE_KEY is required}
      CREEM_API_KEY: ${CREEM_API_KEY:-}
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
      CREEM_TEST_MODE: ${CREEM_TEST_MODE:-true}
      CREEM_PRO_MONTHLY_PRODUCT_ID: ${CREEM_PRO_MONTHLY_PRODUCT_ID:-}
      CREEM_PRO_YEARLY_PRODUCT_ID: ${CREEM_PRO_YEARLY_PRODUCT_ID:-}
      CREEM_SCALE_MONTHLY_PRODUCT_ID: ${CREEM_SCALE_MONTHLY_PRODUCT_ID:-}
      CREEM_SCALE_YEARLY_PRODUCT_ID: ${CREEM_SCALE_YEARLY_PRODUCT_ID:-}
      CREEM_PRIVATE_MONTHLY_PRODUCT_ID: ${CREEM_PRIVATE_MONTHLY_PRODUCT_ID:-}
      CREEM_PRIVATE_YEARLY_PRODUCT_ID: ${CREEM_PRIVATE_YEARLY_PRODUCT_ID:-}
      IP_ENCRYPTION_KEY: ${IP_ENCRYPTION_KEY:?IP_ENCRYPTION_KEY is required}
      TRUSTCAPTCHA_API_URL: http://api:3000
      TRUSTCAPTCHA_SIGNUP_SECRET: ${DEMO_SITE_SECRET:?DEMO_SITE_SECRET is required}
    networks:
      - backend
      - caddy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      <<: *stateless-deploy
      replicas: 1

  api:
    image: ${IMAGE_PREFIX}/api:${IMAGE_TAG:-latest}
    environment:
      <<: *app-environment
      ACTIVE_TOKEN_SIGNING_KEY_ID: ${ACTIVE_TOKEN_SIGNING_KEY_ID:-prod-k1}
      IP_ENCRYPTION_KEY: ${IP_ENCRYPTION_KEY:?IP_ENCRYPTION_KEY is required}
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:?IP_HASH_PEPPER is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      REQUEST_BINDING_PEPPER: ${REQUEST_BINDING_PEPPER:?REQUEST_BINDING_PEPPER is required}
      RETENTION_CRON_SECRET: ${RETENTION_CRON_SECRET:?RETENTION_CRON_SECRET is required}
      TOKEN_SIGNING_KEYS: ${TOKEN_SIGNING_KEYS:?TOKEN_SIGNING_KEYS is required}
      TRUST_PROXY: "true"
    networks:
      - backend
      - caddy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s
    deploy:
      <<: *stateless-deploy
      replicas: 2

  demo:
    image: ${IMAGE_PREFIX}/demo:${IMAGE_TAG:-latest}
    environment:
      NEXT_PUBLIC_API_URL: https://api.trustcaptcha.xuandev.com
      NEXT_PUBLIC_DASHBOARD_URL: https://app.trustcaptcha.xuandev.com
      NEXT_PUBLIC_DEMO_SITE_KEY: ${DEMO_SITE_KEY:?DEMO_SITE_KEY is required}
      NEXT_PUBLIC_SITE_URL: https://trustcaptcha.xuandev.com
      TRUSTCAPTCHA_API_URL: http://api:3000
      TRUSTCAPTCHA_DEMO_SECRET: ${DEMO_SITE_SECRET:?DEMO_SITE_SECRET is required}
    networks:
      - backend
      - caddy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/zh-CN').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      <<: *stateless-deploy
      replicas: 2

  retention:
    image: alpine:3.22
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sleep 900
        while true; do
          wget -qO- --header="Authorization: Bearer $${RETENTION_CRON_SECRET}" --post-data='' http://api:3000/api/internal/retention || true
          sleep 86400
        done
    environment:
      RETENTION_CRON_SECRET: ${RETENTION_CRON_SECRET:?RETENTION_CRON_SECRET is required}
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s

networks:
  backend:
    driver: overlay
    driver_opts:
      encrypted: ""
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
